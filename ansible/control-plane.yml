---
- name: Initialize the Kubernetes control plane on cp1
  hosts: k8s_master
  become: true

  tasks:
    - name: Pre-pull the control plane images
      ansible.builtin.command: kubeadm config images pull
      changed_when: false

    - name: Initialize the cluster with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ cp1_ip }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create the .kube directory for the automation user
      ansible.builtin.file:
        path: "/home/{{ cluster_user }}/.kube"
        state: directory
        owner: "{{ cluster_user }}"
        group: "{{ cluster_user }}"
        mode: "0755"

    - name: Copy admin.conf to the automation user's kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ cluster_user }}/.kube/config"
        remote_src: true
        owner: "{{ cluster_user }}"
        group: "{{ cluster_user }}"
        mode: "0600"

    - name: Show the node status before the network plugin is installed
      ansible.builtin.command: kubectl get nodes
      become: false
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      register: nodes_before
      changed_when: false

    - name: Display the node status
      ansible.builtin.debug:
        var: nodes_before.stdout_lines

    - name: Apply the Calico CNI v3.31.0
      ansible.builtin.command: >
        kubectl apply -f
        https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/calico.yaml
      become: false
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      register: calico_apply
      changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

    - name: Wait for the default Calico IP pool to exist
      ansible.builtin.command: kubectl get ippools.crd.projectcalico.org default-ipv4-ippool
      become: false
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      register: pool_check
      retries: 30
      delay: 10
      until: pool_check.rc == 0
      changed_when: false

    - name: Read the current IP-in-IP mode of the pool
      ansible.builtin.command: >
        kubectl get ippools.crd.projectcalico.org default-ipv4-ippool
        -o jsonpath={.spec.ipipMode}
      become: false
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      register: ipip_mode
      changed_when: false

    - name: Switch Calico from IP-in-IP to VXLAN (Azure drops IP-in-IP packets)
      ansible.builtin.command: >
        kubectl patch ippools.crd.projectcalico.org default-ipv4-ippool
        --type=merge -p '{"spec":{"ipipMode":"Never","vxlanMode":"Always"}}'
      become: false
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      when: ipip_mode.stdout != 'Never'
      register: pool_patch

    - name: Restart calico-node so the new mode takes effect
      ansible.builtin.command: kubectl rollout restart daemonset/calico-node -n kube-system
      become: false
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      when: pool_patch is changed

    - name: Wait until the control plane node is Ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=420s
      become: false
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      changed_when: false

    - name: Create the join command for the workers
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_result
      changed_when: false

    - name: Store the join command for workers.yml
      ansible.builtin.set_fact:
        join_command: "{{ join_command_result.stdout }}"