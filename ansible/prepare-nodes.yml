---
- name: Prepare all cluster nodes
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Update the DNF cache and upgrade all installed packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install admin tools
      ansible.builtin.dnf:
        name:
          - nano
          - vim-enhanced
          - git
          - curl
          - wget
          - bash-completion
          - tar
          - tmux
        state: present

    - name: Install networking and troubleshooting tools
      ansible.builtin.dnf:
        name:
          - iproute
          - net-tools
          - bind-utils
          - traceroute
          - tcpdump
          - lsof
          - sysstat
        state: present

    - name: Install Python 3, pip and the reboot-check utility
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
          - dnf-utils
        state: present