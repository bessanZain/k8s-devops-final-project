---
- name: Install Kubernetes packages
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Import the Kubernetes repository signing key
      ansible.builtin.rpm_key:
        key: "https://pkgs.k8s.io/core:/stable:/v1.36/rpm/repodata/repomd.xml.key"
        state: present

    - name: Add the official Kubernetes v1.36 repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes v1.36
        baseurl: "https://pkgs.k8s.io/core:/stable:/v1.36/rpm/"
        gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v1.36/rpm/repodata/repomd.xml.key"
        enabled: true
        exclude:
          - kubelet
          - kubeadm
          - kubectl
          - cri-tools
          - kubernetes-cni

    - name: Install kubelet, kubeadm and kubectl
      ansible.builtin.dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
          - iproute-tc
        state: present
        disable_excludes: kubernetes

    - name: Enable the kubelet service (kubeadm starts it later)
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Stop and disable firewalld (the Azure NSG is the firewall)
      ansible.builtin.systemd:
        name: firewalld
        enabled: false
        state: stopped
      register: firewalld_result
      failed_when:
        - firewalld_result.failed is defined
        - firewalld_result.failed
        - "'Could not find' not in (firewalld_result.msg | default(''))"