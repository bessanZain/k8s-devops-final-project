---
- name: Install and configure containerd
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Import the Docker repository signing key
      ansible.builtin.rpm_key:
        key: https://download.docker.com/linux/rhel/gpg
        state: present

    - name: Add the Docker CE repository
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: "https://download.docker.com/linux/rhel/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/rhel/gpg
        enabled: true

    - name: Install containerd.io
      ansible.builtin.dnf:
        name: containerd.io
        state: present

    - name: Check whether a full containerd configuration already exists
      ansible.builtin.command: grep -q SystemdCgroup /etc/containerd/config.toml
      register: containerd_config_check
      changed_when: false
      failed_when: containerd_config_check.rc > 1

    - name: Generate the default containerd configuration
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      when: containerd_config_check.rc != 0

    - name: Use the systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup = false'
        replace: '\1SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted