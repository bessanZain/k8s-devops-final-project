<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: 1rem; }
    form.add { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    form.add input[name=title] { flex: 2; min-width: 180px; }
    form.add input[name=description] { flex: 3; min-width: 200px; }
    input, select, button { padding: .5rem; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    tr.done td:first-child { text-decoration: line-through; color: #888; }
    .badge { padding: .15rem .6rem; border-radius: 1rem; font-size: .85rem; color: #fff; }
    .badge.high { background: #c0392b; }
    .badge.medium { background: #d68910; }
    .badge.low { background: #2e86c1; }
    td form { display: inline; }
    footer { margin-top: 2rem; color: #777; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Task Tracker</h1>

  <form class="add" method="post" action="{{ url_for('main.create_task_form') }}">
    <input name="title" placeholder="Task title" maxlength="120" required>
    <input name="description" placeholder="Description (optional)">
    <select name="priority">
      {% for p in priorities %}
      <option value="{{ p }}" {% if p == default_priority %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
    <button type="submit">Add task</button>
  </form>

  <table>
    <tr><th>Task</th><th>Priority</th><th>Status</th><th>Actions</th></tr>
    {% for task in tasks %}
    <tr class="{{ 'done' if task.done }}">
      <td>{{ task.title }}<br><small>{{ task.description }}</small></td>
      <td><span class="badge {{ task.priority }}">{{ task.priority }}</span></td>
      <td>{{ 'Done' if task.done else 'Open' }}</td>
      <td>
        <form method="post" action="{{ url_for('main.toggle_task', task_id=task.id) }}">
          <button type="submit">{{ 'Reopen' if task.done else 'Done' }}</button>
        </form>
        <form method="post" action="{{ url_for('main.delete_task_form', task_id=task.id) }}">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4">No tasks yet.</td></tr>
    {% endfor %}
  </table>

  <footer>Version {{ version }}</footer>
</body>
</html>
